<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Converter Chatbot</title>
    <link rel="stylesheet" href="chatbot.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Chatbot Container -->
    <div class="chatbot-container" id="chatbotContainer">
        <!-- Chatbot Header -->
        <div class="chatbot-header">
            <h3>Image Converter AI Assistant</h3>
            <button class="close-btn" id="closeBtn">×</button>
        </div>
        
        <!-- Chat Messages Area -->
        <div class="chat-messages" id="chatMessages">
            <div class="bot-message">
                <p>Hi there! I can help you find the right image converter.</p>
            </div>
        </div>
        
        <!-- User Input Area -->
        <div class="user-input">
            <input type="text" id="userInput" placeholder="Type your conversion request...">
            <button id="sendBtn">Send</button>
        </div>
    </div>
    
    <!-- Chatbot Toggle Button with Welcome Text -->
    <div class="chatbot-toggle-container" id="chatbotToggleContainer">
        <div class="welcome-text">Need help with conversions?</div>
        <div class="chatbot-toggle" id="chatbotToggle">
            <i class="fas fa-robot bounce"></i>
        </div>
    </div>
    
    <script src="chatbot.js"></script>
</body>
</html>
